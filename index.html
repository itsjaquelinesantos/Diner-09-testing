<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu 3D</title>

    <!-- Biblioteca para visualizar modelos 3D e AR -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        h1 {
            margin-top: 25px;
        }

        .produto {
            background: white;
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        model-viewer {
            width: 100%;
            height: 400px;
        }

        .botao {
            background: #111;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <h1>Diner 09</h1>

    <div class="produto">

        <h2>Cheeseburger</h2>

        <model-viewer
            src="modelos/Cheeseburger.glb"
            ar
            ar-modes="scene-viewer webxr quick-look"
            camera-controls
            auto-rotate
            shadow-intensity="1">

            <button
                class="botao"
                slot="ar-button">

                📱 Ver em Realidade Aumentada

            </button>

        </model-viewer>

    </div>

</body>

</html>
