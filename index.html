<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu 3D - Realidade Aumentada</title>

    <!-- Biblioteca Model Viewer -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        header {
            padding: 25px 15px 10px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            color: #666;
            margin-top: 8px;
        }

        .produto {
            width: 92%;
            max-width: 600px;
            margin: 25px auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        .produto h2 {
            margin-top: 0;
        }

        model-viewer {
            width: 100%;
            height: 450px;
            background: #f8f8f8;
            border-radius: 15px;
        }

        .botao-ra {
            margin-top: 15px;
            padding: 14px 22px;
            border: none;
            border-radius: 12px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .botao-ra:hover {
            opacity: 0.85;
        }

        .preco {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
        }

        .erro {
            margin: 40px auto;
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 20px;
        }

    </style>

</head>


<body>

    <header>

        <h1>🍔 Meu Menu</h1>

        <p>Visualize o produto em 3D e experimente em realidade aumentada!</p>

    </header>


    <!-- Produto será carregado automaticamente aqui -->

    <div id="produto-container"></div>


    <script>

        // =====================================================
        // PRODUTOS
        // =====================================================

        const produtos = {

            hamburguer: {
                nome: "Hambúrguer",
                preco: "R$ 25,00",
                glb: "modelos/hamburguer.glb",
                usdz: "modelos/hamburguer.usdz"
            },

            pizza: {
                nome: "Pizza",
                preco: "R$ 35,00",
                glb: "modelos/pizza.glb",
                usdz: "modelos/pizza.usdz"
            },

            refrigerante: {
                nome: "Refrigerante",
                preco: "R$ 8,00",
                glb: "modelos/refrigerante.glb",
                usdz: "modelos/refrigerante.usdz"
            },

            sobremesa: {
                nome: "Sobremesa",
                preco: "R$ 15,00",
                glb: "modelos/sobremesa.glb",
                usdz: "modelos/sobremesa.usdz"
            }

        };


        // =====================================================
        // PEGAR O PRODUTO DA URL
        // =====================================================

        const parametros = new URLSearchParams(window.location.search);

        const produtoSelecionado = parametros.get("produto");


        // =====================================================
        // CONTAINER
        // =====================================================

        const container = document.getElementById("produto-container");


        // =====================================================
        // VERIFICAR SE O PRODUTO EXISTE
        // =====================================================

        if (produtoSelecionado && produtos[produtoSelecionado]) {

            const produto = produtos[produtoSelecionado];


            container.innerHTML = `

                <div class="produto">

                    <h2>${produto.nome}</h2>

                    <div class="preco">
                        ${produto.preco}
                    </div>

                    <model-viewer
                        src="${produto.glb}"
                        ios-src="${produto.usdz}"
                        ar
                        ar-modes="scene-viewer webxr quick-look"
                        camera-controls
                        auto-rotate
                        shadow-intensity="1">

                        <button
                            class="botao-ra"
                            slot="ar-button">

                            📱 Ver em Realidade Aumentada

                        </button>

                    </model-viewer>

                </div>

            `;

        }

        else {

            container.innerHTML = `

                <div class="erro">

                    <h2>🍽️ Produto não encontrado</h2>

                    <p>
                        Verifique o QR Code e tente novamente.
                    </p>

                </div>

            `;

        }

    </script>

</body>

</html>
